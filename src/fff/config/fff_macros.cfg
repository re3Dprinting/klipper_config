[gcode_macro PURGE_LEFT]
description: Purge the left extruder 25mm (checks for temperature to be above 178C)
gcode:
    {% if printer.extruder.temperature < 178 %}
        M117 Left Nozzle is below minimum temperature!
        M118 Left Nozzle is below minimum temperature!
    {% else %}
        M117 Purging Left 25mm
        T0
        M83
        G1 E25 F120
        G90
    {% endif %}

[gcode_macro PURGE_RIGHT]
description: Purge the right extruder 25mm (checks for temperature to be above 178C)
gcode:
    {% if printer.extruder1.temperature < 178 %}
        M117 Right Nozzle is below minimum temperature!
        M118 Right Nozzle is below minimum temperature!
    {% else %}
        M117 Purging Right 25mm
        T1
        M83
        G1 E25 F120
        G90
    {% endif %}

#Pause, Resume, Cancel Macros
[gcode_macro CANCEL_PRINT]
description: Cancels the current print and lowers the bed 30mm
rename_existing: BASE_CANCEL_PRINT
gcode:
    SAFE_LIFT_Z Z=30
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
description: Pause the print and park the nozzle 
rename_existing: BASE_PAUSE
gcode:
    CLEAR_PAUSE
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=e0_temp VALUE={printer.extruder.target}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=e1_temp VALUE={printer.extruder1.target}
    SAVE_GCODE_STATE NAME=PAUSE_STATE
    BASE_PAUSE
    PARK_NOZZLE

[gcode_macro PAUSE_NO_PARK]
description: Pause the print without parking the nozzle
gcode:
    CLEAR_PAUSE
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=e0_temp VALUE={printer.extruder.target}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=e1_temp VALUE={printer.extruder1.target}
    SAVE_GCODE_STATE NAME=PAUSE_STATE
    BASE_PAUSE

[gcode_macro PAUSE_CONTINUOUS_PRINTING_AFTER_RUNOUT]
description: Pause for continuous printing, swap extruder temperatures
gcode:
    CLEAR_PAUSE
    SET_GCODE_VARIABLE MACRO=RESUME_CONTINUOUS_PRINTING_AFTER_RUNOUT VARIABLE=e0_temp VALUE={printer.extruder1.target}
    SET_GCODE_VARIABLE MACRO=RESUME_CONTINUOUS_PRINTING_AFTER_RUNOUT VARIABLE=e1_temp VALUE={printer.extruder.target}
    SAVE_GCODE_STATE NAME=PAUSE_STATE
    BASE_PAUSE

[gcode_macro RESUME]
description: Resumes the print and restores the nozzle temperature
rename_existing: BASE_RESUME
variable_e0_temp: 0
variable_e1_temp: 0
gcode:
    M117
    M118 E0 Resume Temp { e0_temp }
    M118 E1 Resume Temp { e1_temp }
    M104 S{e0_temp} T0
    M104 s{e1_temp} T1
    M109 S{e0_temp} T0
    M109 s{e1_temp} T1
    M400
    RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1 MOVE_SPEED=80
    M400
    BASE_RESUME

[gcode_macro RESUME_CONTINUOUS_PRINTING_AFTER_RUNOUT]
description: Resumes the print and restores the nozzle temperature after filament runout
variable_e0_temp: 0
variable_e1_temp: 0
variable_resume_e: "T0"
gcode:
    M118 E0 Resume Temp { e0_temp }
    M118 E1 Resume Temp { e1_temp }
    M104 S{e0_temp} T0
    M104 s{e1_temp} T1
    M109 S{e0_temp} T0
    M109 s{e1_temp} T1
    {resume_e}
    RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1 MOVE_SPEED=80
    BASE_RESUME
    {resume_e}

# Preheating Macros
[gcode_macro PLA_E0]
description: Preheat the left extruder to 240C
gcode: M104 T0 S240
[gcode_macro PLA_E1]
description: Preheat the right extruder to 240C
gcode: M104 T1 S240
[gcode_macro PLA_BED]
description: Preheat the bed to 60C
gcode: M140 S60
[gcode_macro PLA_ALL]
description: Preheat both extruders to 240C and bed to 60C
gcode: 
    PLA_E0
    PLA_E1
    PLA_BED

[gcode_macro PETG_E0]
description: Preheat the left extruder to 265C
gcode: M104 T0 S265
[gcode_macro PETG_E1]
description: Preheat the right extruder to 265C
gcode: M104 T1 S265
[gcode_macro PETG_BED]
description: Preheat the bed to 70C
gcode: M140 S70
[gcode_macro PETG_ALL]
description: Preheat both extruders to 265C and bed to 70C
gcode: 
    PETG_E0
    PETG_E1
    PETG_BED

[gcode_macro PC_E0]
description: Preheat the left extruder to 260C
gcode: M104 T0 S260
[gcode_macro PC_E1]
description: Preheat the right extruder to 260C
gcode: M104 T1 S260
[gcode_macro PC_BED]
description: Preheat the bed to 115C
gcode: M140 S115
[gcode_macro PC_ALL]
description: Preheat both extruders to 260C and bed to 115C
gcode: 
    PC_E0
    PC_E1
    PC_BED

[gcode_macro DITTO_PRINTING_ENABLE]
description: Enable ditto printing
gcode:
    M117 Ditto Printing Enabled!
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder

[gcode_macro DITTO_PRINTING_DISABLED]
description: Disable ditto printing
gcode:
    M117 Ditto Printing Disabled!
    SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1

[gcode_macro CONTINUOUS_PRINTING_AFTER_RUNOUT_ENABLE]
description: Enable continuous printing after filament runout
gcode:
    M117 Continuous Printing After Filament Runout Enabled!
    #Disable Ditto Printing when enabling CPAFR
    SAVE_VARIABLE VARIABLE=continuous_printing_after_runout VALUE='"true"'

[gcode_macro CONTINUOUS_PRINTING_AFTER_RUNOUT_DISABLE]
description: Disable continuous printing after filament runout
gcode:
    M117 Continuous Printing After Filament Runout Disabled!
    SAVE_VARIABLE VARIABLE=continuous_printing_after_runout VALUE='"false"'

[gcode_macro STARTUP_PROCEDURE]
description: Calibrations neccessary for repeatable print results. Must provide HOTEND_TEMP and BED_TEMP parameters. typical usage: STARTUP_PROCEDURE HOTEND_TEMP=230 BED_TEMP=65
gcode:
#----- PARAMETERS/VARIABLES -----

  {% set hotend_temp = params.HOTEND_TEMP|default(0)|float %}                   # *REQUIRED* HOTEND_TEMP=<value> - hotend temperature for printing/purging.
  {% set bed_temp = params.BED_TEMP|default(0)|float %}                         # *REQUIRED* BED_TEMP=<value> - bed temperature for printing/probing.
  {% set probing_temperature = params.PROBE_TEMP|default(110)|float %}          # PROBE_TEMP=<value> (default=110) - hotend temperature for probing the bed.
  {% set purge_amount = params.PURGE_AMOUNT|default(30)|float %}                # PURGE_AMOUNT=<value> (default=30) - extruder purge amount in mm during nozzle cleaning.
  {% set ram_count = params.RAM_COUNT|default(2)|int %}                         # RAM_COUNT=<value> (default=2) - amount of times the extruder retracts and extrudes during nozzle cleaning.
  {% set toolhead_shake = params.TOOLHEAD_SHAKE|default(10)|int %}              # TOOLHEAD_SHAKE=<value> (default=10) - amount of times the toolhead goes back and forth to loosen filament during nozzle cleaning. 
  {% set wipe_count = params.WIPE_COUNT|default(3)|int %}                       # WIPE_COUNT=<value> (default=3) - amount of wiping moves preformed on the print surface during nozzle cleaning.
  {% set z_global_offset = params.Z_GLOBAL_OFFSET|default(0.175)|float %}       # Z_GLOBAL_OFFSET=<value> (default=0.175) - pre-determined Z babystep amount from thermal expansion.
  
#----- CLEAR MESH/OFFSET -----

  BED_MESH_CLEAR                                                                # clear any loaded mesh 
  SET_GCODE_OFFSET Z=0                                                          # reset global z offset to 0
  {% if bed_temp == 0 %}                                                        # checking that BED_TEMP parameter was provided, raises an error if not
    {action_respond_info('Error: Must provide bed temperature parameter')}
    {action_raise_error('Error: Must provide bed temperature parameter')}
  {% else %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}                  # start heating bed
  {% endif %}
  G92 E0                                                                        # reset extruder position
  M117 Homing...
  G28                                                                           # homing
  
#----- NOZZLE CLEANING PROCEDURE -----

  M117 Nozzle Cleaning...
  G0 Z20                                                                        # lift Z axis
  G1 X590 Y610 F6000                                                            # go to purge position
  {% if hotend_temp == 0 %}                                                     # checking that HOTEND_TEMP parameter was provided, raises an error if not
    {action_respond_info('Error: Must provide hotend temperature parameter')}
    {action_raise_error('Error: Must provide hotend temperature parameter')}    
  {% else %}
    SET_HEATER_TEMPERATURE{hotend_temp}                                         # heat hotend to purging temperature
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hotend_temp - 1}
  {% endif %}
  
#----- PURGING -----

  SET_FAN_SPEED FAN=fan SPEED=1                                                 # turn print fan on to blow the filament off the bed
  M83                                                                           # relative extrusion
  G1 E{purge_amount} F100                                                       # purge the provided length (default 30mm)
  
#----- SHAKE TOOLHEAD -----

  {% for i in range(toolhead_shake) %}                                          # shakes the toolhead back and forth to try detaching the purged filament from the nozzle
    G1 X585 F25000
    G1 X590 F25000
  {% endfor %}
  
#----- RAMMING FILAMENT -----

  {% for i in range(ram_count) %}                                               # rams the filament to detach purged filament and keep a clean filament tip
    G1 E-11 F1000
    G1 E11 F1000
  {% endfor %}
  G1 E-11 F1000                                                                 # end ram move to keep the filament retracted
  
#----- WIPE NOZZLE ON PRINT SURFACE -----

  G0 X570                                                                       # move left slightly to start wiping procedure, keeps remaining purge from sticking if it hasnt been detached yet. 
  G0 Z0
  {% for i in range(wipe_count) %}                                              # wipe in square moves going left on the print surface.
    G91
    G0 X-5
    G90
    G0 Y606
    G91
    G0 X-5
    G90
    G0 Y610 
  {% endfor %}                                                                  # at this point, tip of nozzle should be clean and purged filament off the bed. 
  
#----- MODEL CALIBRATION -----

  G0 Z2
  M117 Cooling Down for Contact...
  M104 S{probing_temperature}                                                   # cooldown for probing temperature, keeping fan on to help cool faster
  G1 X40 Y570 F6000                                                             # go to probing position
  M109 S{probing_temperature}
  SET_FAN_SPEED FAN=fan SPEED=0                                                 # once probing temperature has been reached, turn off fans
  M117 Probe Model Calibration...
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp - 2}
  G28 Z METHOD=CONTACT CALIBRATE=1                                              # calibrate probe model 
  
#----- BED TRAMMING -----

  M117 Bed Tramming Calibration...
  Z_TILT_ADJUST                                                                 # probe positions at the z lead screws and automatically tram the bed 
  M117 Adaptive Mesh Calibration...
  BED_MESH_CALIBRATE PROBE_METHOD=contact ADAPTIVE=1                            # only probe points on the bed where the part will be printed
  
#----- Z OFFSET CALIBRATION -----

  M117 Z Offset Calibration...
  G28 Z METHOD=CONTACT CALIBRATE=0                                              # calibrate z offset
  M117 Heating to Print Temperature...
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET={hotend_temp}                   # heat to print temp
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={hotend_temp - 1}
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp - 2}
  SET_GCODE_OFFSET Z={z_global_offset}                                          # set thermal expansion global z offset
  M117
  
  